<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Verify OTP</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <section class="card">
      <div class="brand">Melsoft OTP</div>
      <h1>Verify OTP</h1>
      <p class="subtitle">Enter the email address and the 6-digit OTP you received.</p>

      <form id="verifyForm">
        <label for="verifyEmail">Email address</label>
        <input id="verifyEmail" name="email" type="email" placeholder="you@example.com" required />

        <label for="otp">OTP</label>
        <input id="otp" name="otp" type="text" inputmode="numeric" maxlength="6" placeholder="000000" required />

        <button type="submit">Verify OTP</button>
      </form>

      <p id="verifyMessage" class="message"></p>
      <a href="index.html" class="link">← Back to Send OTP</a>
    </section>
  </main>

  <script src="verify.js"></script>
</body>
</html>
